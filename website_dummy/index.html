<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smart Vending AI</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

<h1>Smart Vending Machine</h1>

<!-- 🔥 MODE -->
<h3>Pilih Mode</h3>
<button onclick="setMode('manual')">Manual</button>
<button onclick="setMode('llm')">LLM</button>

<p>Mode sekarang: <b id="mode">manual</b></p>

<hr>

<!-- 🔥 LLM MODE -->
<div id="llmSection" style="display:none;">
    <h3>Input AI</h3>
    <input type="text" id="inputText" placeholder="contoh: capcay 2 dan nasi goreng">
    <button onclick="sendLLM()">Kirim ke AI</button>
</div>

<!-- 🔥 MANUAL MODE -->
<div id="manualSection">
    <h3>Pilih Bahan</h3>

    <!-- contoh bahan -->
    <button onclick="addItem(1)">Bahan 1</button>
    <button onclick="addItem(2)">Bahan 2</button>
    <button onclick="addItem(3)">Bahan 3</button>
    <button onclick="addItem(4)">Bahan 4</button>
    <button onclick="addItem(5)">Bahan 5</button>
    <button onclick="addItem(6)">Bahan 6</button>

    <br><br>
    <div style="margin-top:10px;">
        <button onclick="checkout()">Checkout</button>
        <button onclick="clearCart()">Clear Cart</button>
    </div>
</div>

<hr>

<h3>Keranjang</h3>
<pre id="cart"></pre>

<h3>Output</h3>
<pre id="output"></pre>

<script>
const machine_id = "VM001"; // nanti dari QR kalau sudah jadi

const client = mqtt.connect("ws://broker.hivemq.com:8000/mqtt");

client.on("connect", () => {
    console.log("MQTT Connected");
});

client.on("error", (err) => {
    console.log("MQTT Error:", err);
});

let cart = [];
let mode = "manual";

function setMode(m) {
    mode = m;
    document.getElementById("mode").innerText = m;

    if (m === "manual") {
        document.getElementById("manualSection").style.display = "block";
        document.getElementById("llmSection").style.display = "none";
    } else {
        document.getElementById("manualSection").style.display = "none";
        document.getElementById("llmSection").style.display = "block";
    }
}

function addItem(item) {
    cart.push(item);
    updateCart();
}

function updateCart() {
    document.getElementById("cart").innerText = JSON.stringify(cart);
}

async function checkout() {
    if (cart.length === 0) {
        alert("Keranjang kosong!");
        return;
    }

    try {
        const res = await fetch("http://127.0.0.1:8000/manual-checkout", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ items: cart })
        });

        const data = await res.json();

        document.getElementById("output").innerText = JSON.stringify(data, null, 2);

        if (!data.items || data.items.length === 0) {
            alert("Semua item habis!");
            return;
        }

        // 🔥 KONFIRMASI USER
        const confirmSend = confirm("Kirim item ke mesin?\n" + JSON.stringify(data.items));
        if (!confirmSend) return;

        // 🔥 KIRIM MQTT
        sendToMachine(data.items);

        // 🔥 RESET CART
        cart = [];
        updateCart();

    } catch (err) {
        console.log(err);
        alert("Server belum jalan / error!");
    }
}
async function sendLLM() {
    const text = document.getElementById("inputText").value;

    try {
        const res = await fetch("http://127.0.0.1:8000/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ message: text })
        });

        const data = await res.json();

        document.getElementById("output").innerText = JSON.stringify(data, null, 2);

        if (!data.items || data.items.length === 0) {
            alert("AI tidak menghasilkan item");
            return;
        }

        cart = cart.concat(data.items);
        updateCart();

    } catch (err) {
        console.log(err);
        alert("Server LLM belum jalan!");
    }
}

function sendToMachine(items) {
    if (!client.connected) {
        alert("MQTT belum connect!");
        return;
    }

    const topic = `vending/${machine_id}/cmd`;

    const payload = {
        items: items
    };

    client.publish(topic, JSON.stringify(payload));

    console.log("SEND MQTT:", topic, payload);
}

function clearCart() {
    cart = [];
    updateCart();
}

</script>

</body>
</html>
